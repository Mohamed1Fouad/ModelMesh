name: Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  build-artifacts:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build VSCode extension
        run: |
          pnpm --filter modelmesh-vscode build
          pnpm --filter modelmesh-vscode exec vsce package --no-dependencies --out modelmesh-vscode.vsix

      - name: Upload VSCode extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: modelmesh-vscode
          path: apps/vscode-ext/modelmesh-vscode.vsix

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build JetBrains plugin
        run: |
          cd apps/jetbrains-plugin
          ./gradlew buildPlugin

      - name: Upload JetBrains plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: modelmesh-jetbrains
          path: apps/jetbrains-plugin/build/distributions/*.zip

      - name: Upload OpenClaw plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: modelmesh-openclaw-plugin
          path: plugins/openclaw/
